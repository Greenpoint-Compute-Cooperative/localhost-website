<style>
  @font-face { font-family: "IBM Plex Mono"; src: url("fonts/IBMPlexMono-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "IBM Plex Mono"; src: url("fonts/IBMPlexMono-500.woff2") format("woff2"); font-weight: 500; font-display: swap; }
  @font-face { font-family: "IBM Plex Mono"; src: url("fonts/IBMPlexMono-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }
  /* same tokens as the home page's window (theme 9, ciphertext) */
  :root { --pg: #0c0e11; --fg: #e9ecef; --ln: #2a3038; --pri: #c8ff00; --prifg: #0b0b0c; --hi: #f2f4f6; --mid: #a7b0ba; --lo: #6b747e; --read: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
  html, body { height: auto; }
  body { min-height: 100svh; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; cursor: crosshair; }
  .corner { position: absolute; z-index: 5; padding: 18px 20px; line-height: 1.7; pointer-events: none; }
  .tl { top: 0; left: 0; } .tr { top: 0; right: 0; text-align: right; position: fixed; }
  .rec { color: #ff3b2f; }
  .win { position: relative; z-index: 10; margin: 64px 12px 0; width: min(560px, calc(100vw - 24px)); background: var(--pg); color: var(--fg); border: 1px solid var(--pri); box-shadow: 12px 12px 0 rgba(0,0,0,.6); cursor: default; }
  .ch { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #14181d; border-bottom: 1px solid var(--ln); font-size: 12px; }
  .ch .lk { flex: none; width: 10px; height: 8px; background: var(--pri); position: relative; margin-top: 5px; }
  .ch .lk::before { content: ""; position: absolute; left: 2px; top: -6px; width: 4px; height: 5px; border: 1px solid var(--pri); border-bottom: 0; }
  .ch .f { flex: 1; min-width: 0; padding: 5px 9px; border: 1px solid var(--ln); }
  .ch .k { color: #8b939c; font-size: 11px; white-space: nowrap; }
  .ch .x { color: #8b939c; text-decoration: none; padding: 0 2px; } .ch .x:hover { color: var(--pri); }
  .head { padding: 20px 20px 0; }
  .head h1 { font-weight: normal; font-size: 26px; letter-spacing: .02em; text-transform: uppercase; color: var(--hi); }
  .head .when { margin-top: 6px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--lo); }
  .apf { padding: 18px 20px 22px; }
  .apf .row2 .b { min-width: 140px; text-align: center; }
  .b { font: 13px var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 12px 18px; background: var(--pg); color: var(--hi); border: 1px solid #3a424c; text-decoration: none; cursor: pointer; }
  .b.pri { background: var(--pri); color: var(--prifg); border-color: var(--pri); }
  .b:hover { background: var(--pri); color: var(--prifg); }
  .b:disabled { opacity: .6; cursor: wait; }
  .foot { position: relative; z-index: 10; display: flex; gap: 22px; margin: 22px 0 28px; }
  .foot a { text-decoration: none; } .foot a:hover { color: var(--pri); }
  .foot { flex-wrap: wrap; justify-content: center; }
  .host { display: inline-flex; align-items: center; gap: 7px; } .host a { display: inline-flex; align-items: center; gap: 7px; } .host canvas { width: 18px; height: 18px; display: block; }
  @media (max-width: 640px) {
    .corner.tr, .ch .k { display: none; }
    .win { margin-top: 58px; }
    .head { padding: 18px 16px 0; } .apf { padding: 16px 16px 20px; }
    .apf .row2 .b { flex: 1 1 100%; text-align: center; }
  }

<body>
<canvas class="thermal" id="c"></canvas>
<div class="corner tl hud"><span class="rec">● REC</span> CAM 07 // NEW YORK</div>
<div class="corner tr hud" id="clock">—</div>
<main class="win" id="apply">
  <div class="ch"><span class="lk"></span><span class="f">localhost/apply</span><span class="k">key held on this machine</span><a class="x" href="/" aria-label="Back to localhost">×</a></div>
  <div class="head"><h1>Apply to hack</h1><p class="when">Sat, Nov 7 · Williamsburg, NYC</p></div>
  <form class="apf" id="apf">
    <p class="note">Three fields, no questions. We read every one and confirm by email.</p>
    <label><span class="k">Email</span><input name="email" type="email" required autocomplete="email" placeholder="you@example.com"></label>
    <label><span class="k">GitHub</span><input name="github" required maxlength="300" placeholder="username or github.com/you" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <label><span class="k">X</span><input name="x" maxlength="300" placeholder="@handle (optional)" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <input type="text" name="field_hp" tabindex="-1" autocomplete="off" aria-hidden="true" class="hp">
    <div class="cf-turnstile" data-action="localhost-hacker" data-theme="dark" data-size="flexible" data-appearance="interaction-only"></div>
    <div class="row2"><button class="b pri" type="submit">Apply</button><span class="msg" id="apmsg" role="status"></span></div>
  </form>
</main>
<nav class="foot hud"><a href="/">← localhost</a><a href="https://theschool.nyc" target="_blank" rel="noopener">The School, NYC ↗</a><span class="host">Hosted by <a href="https://x.com/DistributedMarz" target="_blank" rel="noopener"><canvas id="mark" aria-hidden="true"></canvas> dmarz</a> &amp; <a href="https://x.com/BrennerSpear" target="_blank" rel="noopener">Brenner</a></span></nav>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<script type="module">
import { thermal } from "./shared/thermal.js";
import { cube } from "./shared/cube.js";
import { wireApplyForm } from "./shared/apply-form.js";
cube(document.getElementById("mark"));

thermal(document.getElementById("c"), { block: 5 });
const clock = document.getElementById("clock");
setInterval(() => { clock.innerHTML = new Date().toISOString().replace("T", " ").slice(0, 19) + "Z<br>FRAME " + Math.floor(performance.now() / 41.7); }, 250);

wireApplyForm(document.getElementById("apf"), document.getElementById("apmsg"), { scrollTo: document.getElementById("apply") });
</script>
</body>
