<style>
  @font-face { font-family: "IBM Plex Mono"; src: url("fonts/IBMPlexMono-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "IBM Plex Mono"; src: url("fonts/IBMPlexMono-500.woff2") format("woff2"); font-weight: 500; font-display: swap; }
  @font-face { font-family: "IBM Plex Mono"; src: url("fonts/IBMPlexMono-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }
  body { overflow: hidden; cursor: crosshair; }
  .corner { position: fixed; z-index: 5; padding: 18px 20px; line-height: 1.7; pointer-events: none; }
  .tl { top: 0; left: 0; } .tr { top: 0; right: 0; text-align: right; }
  .rec { color: #ff3b2f; }
  .reticle { position: fixed; z-index: 6; width: 120px; height: 150px; pointer-events: none; transform: translate(-50%, -50%); transition: opacity .25s; }
  .reticle i { position: absolute; width: 14px; height: 14px; border-color: rgba(255,255,255,.9); border-style: solid; }
  .reticle i:nth-child(1) { top: 0; left: 0; border-width: 1px 0 0 1px; }
  .reticle i:nth-child(2) { top: 0; right: 0; border-width: 1px 1px 0 0; }
  .reticle i:nth-child(3) { bottom: 0; left: 0; border-width: 0 0 1px 1px; }
  .reticle i:nth-child(4) { bottom: 0; right: 0; border-width: 0 1px 1px 0; }
  .reticle span { position: absolute; top: calc(100% + 6px); left: 0; white-space: nowrap; }
  .reticle.lost { opacity: 0; }
  .credits { position: fixed; z-index: 5; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; white-space: nowrap; }
  .credits a { color: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 7px; }
  .credits a:hover { color: var(--acid); }
  .credits .sep { opacity: .4; }
  .credits .host { display: inline-flex; align-items: center; gap: 7px; }
  .credits canvas { width: 18px; height: 18px; display: block; }
  .switch { position: fixed; z-index: 60; top: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; }
  .switch button { font: inherit; color: inherit; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.4); padding: 3px 9px; cursor: pointer; }
  .switch button:hover { color: var(--acid); border-color: var(--acid); }

  /* ---------- shared window + page ---------- */
  :root { --pg: #fff; --fg: #0b0b0c; --dim: #5f5f66; --ln: #000; --pri: #c8ff00; --prifg: #0b0b0c; }
  .win { position: fixed; z-index: 10; display: flex; flex-direction: column; cursor: default; background: var(--pg); color: var(--fg); }
  .win[hidden] { display: none; }
  #main { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(700px, calc(100vw - 32px)); }
  .page { padding: 0 0 24px; background: var(--pg); color: var(--fg); }
  .hero { display: block; image-rendering: pixelated; margin: 0 auto; }
  .copy { padding: 0 26px; }
  .sub { margin: 0 0 24px; font-size: clamp(15px, 4.1vw, 25px); line-height: 1.15; letter-spacing: .04em; text-transform: uppercase; }
  .sub .ny { letter-spacing: 0; font-size: 1.1em; vertical-align: -.08em; }
  .line1 { font-size: 22px; line-height: 1.25; }
  .line2 { margin-top: 8px; font-size: 13.5px; line-height: 1.6; color: var(--dim); max-width: 50ch; }
  .meta { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
  .meta b { font-weight: normal; background: var(--pri); color: var(--prifg); padding: 0 4px; }
  .ctas { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .ctas .sp { flex: 1; }
  .b { font: 13px var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 10px 14px; background: var(--pg); color: var(--fg); border: 1px solid var(--ln); text-decoration: none; cursor: pointer; }
  .b:hover { background: var(--fg); color: var(--pg); }
  .b.pri { background: var(--pri); color: var(--prifg); }
  .sponsors { margin-top: 26px; padding-top: 16px; border-top: 1px dashed var(--ln); }
  .sponsors .k { display: block; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
  .sponsors .logos { --h: 19px; margin-top: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; }
  .sponsors a { display: block; line-height: 0; opacity: .82; transition: opacity .15s; }
  .sponsors a:hover { opacity: 1; }
  .sponsors img { display: block; height: calc(var(--h) * var(--s)); width: calc(var(--h) * var(--w) * var(--s)); }
  .pre, .post { padding: 12px 26px 0; font-size: 12px; line-height: 1.6; white-space: pre-wrap; color: var(--dim); }
  .post { padding-top: 18px; }
  .list { font-size: 13px; overflow: auto; max-height: min(420px, 52vh); }
  .list .hdr, .list .row { display: grid; grid-template-columns: 1.3fr 1fr; gap: 8px; padding: 5px 12px; }
  .list .hdr { position: sticky; top: 0; background: var(--pg); border-bottom: 1px solid var(--ln); font-size: 11px; color: var(--dim); }
  .list .row { cursor: pointer; }
  .list .row .g { color: var(--dim); font-size: 11px; }
  .list .row.sel { background: var(--fg); color: var(--pg); }
  .list .row.sel .g { color: inherit; }
  .info { border-top: 1px solid var(--ln); padding: 10px 12px; font-size: 13px; line-height: 1.5; min-height: 58px; }
  .info .k { font-size: 11px; color: var(--dim); }
  .txt { padding: 14px 18px 18px; font-size: 13px; line-height: 1.75; white-space: pre; overflow: auto; }
  .txt .d { color: var(--dim); }

  /* ================= 1 · Macintosh, 1991 ================= */
  [data-t="1"] { --pri: #fff; --prifg: #000; --dim: #333; }
  [data-t="1"] .win { border: 2px solid #000; box-shadow: 4px 4px 0 #000, 14px 14px 0 rgba(0,0,0,.45); }
  [data-t="1"] .ch { position: relative; height: 26px; display: flex; align-items: center; justify-content: center; border-bottom: 2px solid #000; }
  [data-t="1"] .win.focus .ch::before { content: ""; position: absolute; inset: 5px 4px; background: repeating-linear-gradient(#000 0 1px, transparent 1px 3px); }
  [data-t="1"] .ch .nm { position: relative; z-index: 1; background: #fff; padding: 0 10px; font-size: 13px; }
  [data-t="1"] .ch .bx { position: absolute; z-index: 1; top: 6px; width: 13px; height: 13px; background: #fff; border: 1px solid #000; outline: 2px solid #fff; padding: 0; }
  [data-t="1"] .ch .bx.l { left: 10px; } [data-t="1"] .ch .bx.r { right: 10px; }
  [data-t="1"] .win:not(.focus) .bx { visibility: hidden; }
  [data-t="1"] .b { border: 2px solid #000; border-radius: 8px; text-transform: none; letter-spacing: 0; padding: 8px 16px; }
  [data-t="1"] .b.pri { outline: 3px solid #000; outline-offset: 2px; }
  [data-t="1"] .meta b { border: 1px solid #000; }

  /* ================= 2 · Windows 95 ================= */
  [data-t="2"] { --pg: #fff; --pri: #c0c0c0; --prifg: #000; --dim: #404040; }
  [data-t="2"] .win { background: #c0c0c0; padding: 3px; box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #dfdfdf, inset -2px -2px #808080, inset 2px 2px #fff, 12px 12px 0 rgba(0,0,0,.45); font-family: Tahoma, "Segoe UI", Arial, sans-serif; }
  [data-t="2"] .ch { display: flex; align-items: center; gap: 6px; padding: 3px 3px 3px 6px; background: linear-gradient(90deg, #000080, #1084d0); color: #fff; font-weight: bold; font-size: 12px; }
  [data-t="2"] .win:not(.focus) .ch { background: linear-gradient(90deg, #808080, #b5b5b5); color: #d4d0c8; }
  [data-t="2"] .ch .ic { width: 14px; height: 14px; background: #fff; box-shadow: inset -2px -2px #808080; }
  [data-t="2"] .ch .ctl { margin-left: auto; display: flex; gap: 2px; }
  [data-t="2"] .ch .ctl span, [data-t="2"] .ch .ctl button { width: 16px; height: 14px; background: #c0c0c0; color: #000; font: bold 10px/12px Tahoma, sans-serif; text-align: center; border: 0; padding: 0; box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff, inset -2px -2px #808080; }
  [data-t="2"] .ch .ctl button { margin-left: 2px; cursor: pointer; }
  [data-t="2"] .menu { display: flex; gap: 14px; padding: 3px 6px; font-size: 12px; }
  [data-t="2"] .menu u { text-decoration: underline; }
  [data-t="2"] .addr { display: flex; align-items: center; gap: 6px; padding: 3px 6px 5px; font-size: 12px; }
  [data-t="2"] .addr .f { flex: 1; background: #fff; padding: 3px 5px; box-shadow: inset 1px 1px #808080, inset -1px -1px #fff, inset 2px 2px #0a0a0a; font-family: var(--mono); }
  [data-t="2"] .addr .go { padding: 2px 10px; box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff, inset -2px -2px #808080; }
  [data-t="2"] .page, [data-t="2"] .list, [data-t="2"] .txt, [data-t="2"] .info { box-shadow: inset 1px 1px #808080, inset 2px 2px #0a0a0a, inset -1px -1px #fff; background: #fff; }
  [data-t="2"] .page { padding-top: 4px; }
  [data-t="2"] .b { font-family: Tahoma, Arial, sans-serif; text-transform: none; letter-spacing: 0; background: #c0c0c0; color: #000; border: 0; padding: 7px 16px; box-shadow: inset -1px -1px #0a0a0a, inset 1px 1px #fff, inset -2px -2px #808080, inset 2px 2px #dfdfdf; }
  [data-t="2"] .b.pri { outline: 1px solid #000; }
  [data-t="2"] .b:active { box-shadow: inset 1px 1px #0a0a0a, inset -1px -1px #fff; }
  [data-t="2"] .b:hover { background: #c0c0c0; color: #000; }
  [data-t="2"] .meta b { background: #000080; color: #fff; }
  [data-t="2"] .stat { display: flex; gap: 3px; padding-top: 3px; font-size: 11px; }
  [data-t="2"] .stat span { padding: 2px 6px; box-shadow: inset 1px 1px #808080, inset -1px -1px #fff; }
  [data-t="2"] .stat span:first-child { flex: 1; }

  /* ================= 3 · NeXTSTEP ================= */
  [data-t="3"] { --pg: #aaa; --fg: #000; --dim: #2b2b2b; --ln: #000; --pri: #fff; --prifg: #000; }
  [data-t="3"] .win { border: 1px solid #000; box-shadow: 12px 12px 0 rgba(0,0,0,.5); }
  [data-t="3"] .ch { display: flex; align-items: center; height: 24px; background: #000; color: #fff; font: bold 13px Helvetica, Arial, sans-serif; border-bottom: 1px solid #000; }
  [data-t="3"] .win:not(.focus) .ch { background: #555; color: #aaa; }
  [data-t="3"] .ch .nm { flex: 1; text-align: center; }
  [data-t="3"] .ch .bx { width: 17px; height: 17px; margin: 0 4px; background: #aaa; border: 0; padding: 0; color: #000; font: bold 11px/17px Helvetica, sans-serif; text-align: center; box-shadow: inset 1px 1px #fff, inset -1px -1px #555; }
  [data-t="3"] .page { border-top: 1px solid #fff; }
  [data-t="3"] .b { font: 13px Helvetica, Arial, sans-serif; text-transform: none; letter-spacing: 0; background: #aaa; color: #000; border: 0; padding: 7px 14px; box-shadow: inset 1px 1px #fff, inset -1px -1px #000, inset -2px -2px #555; }
  [data-t="3"] .b.pri::after { content: " ⏎"; }
  [data-t="3"] .b:hover { background: #fff; color: #000; }
  [data-t="3"] .list, [data-t="3"] .txt { background: #fff; }
  [data-t="3"] .resize { display: flex; height: 9px; border-top: 1px solid #000; background: #aaa; }
  [data-t="3"] .resize i { width: 26px; border-right: 1px solid #000; } [data-t="3"] .resize i:last-child { margin-left: auto; border-left: 1px solid #000; border-right: 0; }

  /* ================= 4 · Amiga Workbench ================= */
  [data-t="4"] { --pg: #0055aa; --fg: #fff; --dim: #cfe0ff; --ln: #fff; --pri: #ff8800; --prifg: #000; }
  [data-t="4"] .win { border: 2px solid #fff; box-shadow: 12px 12px 0 rgba(0,0,0,.5); font-family: var(--mono); }
  [data-t="4"] .ch { display: flex; align-items: stretch; height: 22px; background: #fff; color: #0055aa; font-size: 13px; }
  [data-t="4"] .win:not(.focus) .ch { background: #0055aa; color: #fff; border-bottom: 2px solid #fff; }
  [data-t="4"] .ch .bx { width: 24px; border: 0; padding: 0; background: #ff8800; position: relative; }
  [data-t="4"] .ch .bx.l::after { content: ""; position: absolute; left: 8px; top: 6px; width: 6px; height: 6px; background: #fff; border: 1px solid #000; }
  [data-t="4"] .ch .nm { flex: 1; padding: 3px 8px; background: repeating-linear-gradient(#fff 0 2px, #0055aa 2px 4px); }
  [data-t="4"] .ch .nm span { background: #fff; color: #0055aa; padding: 0 6px; }
  [data-t="4"] .win:not(.focus) .ch .nm { background: none; } [data-t="4"] .win:not(.focus) .ch .nm span { background: none; color: #fff; }
  [data-t="4"] .ch .dp { width: 24px; background: #fff; border-left: 2px solid #0055aa; position: relative; }
  [data-t="4"] .ch .dp::before, [data-t="4"] .ch .dp::after { content: ""; position: absolute; width: 10px; height: 7px; border: 2px solid #0055aa; }
  [data-t="4"] .ch .dp::before { left: 4px; top: 3px; background: #ff8800; } [data-t="4"] .ch .dp::after { left: 8px; top: 8px; background: #fff; }
  [data-t="4"] .b { border: 2px solid #fff; } [data-t="4"] .b.pri { border-color: #000; }
  [data-t="4"] .b:hover { background: #fff; color: #0055aa; }
  [data-t="4"] .list .row.sel { background: #ff8800; color: #000; }

  /* ================= 5 · Teletext ================= */
  [data-t="5"] { --pg: #000; --fg: #fff; --dim: #00ffff; --ln: #fff; --pri: #ffff00; --prifg: #000; }
  [data-t="5"] .win { border: 10px solid #1a1a1a; border-radius: 18px; box-shadow: 0 0 0 2px #000, 12px 12px 0 rgba(0,0,0,.5); font-family: var(--mono); }
  [data-t="5"] .ch { display: flex; gap: 14px; padding: 6px 12px; background: #000; color: #fff; font-size: 14px; }
  [data-t="5"] .ch .p { color: #fff; } [data-t="5"] .ch .s { color: #ffff00; } [data-t="5"] .ch .c { color: #00ffff; margin-left: auto; }
  [data-t="5"] .ch .x { background: none; border: 0; color: #ff0000; font: inherit; cursor: pointer; padding: 0; }
  [data-t="5"] .page { padding-top: 6px; }
  [data-t="5"] .banner { margin: 0 12px; background: #0000ff; }
  [data-t="5"] .sub { color: #00ff00; transform: scaleY(1.35); transform-origin: top; margin-bottom: 26px; }
  [data-t="5"] .line1 { color: #ffff00; transform: scaleY(1.5); transform-origin: top; margin-bottom: 18px; }
  [data-t="5"] .meta { color: #ff00ff; } [data-t="5"] .meta b { background: #ffff00; }
  [data-t="5"] .ctas { gap: 0; justify-content: space-between; }
  [data-t="5"] .ctas .sp { display: none; }
  [data-t="5"] .b { border: 0; background: #000; padding: 6px 4px; font-size: 14px; }
  [data-t="5"] .ctas .b:nth-child(1) { color: #ff0000; } [data-t="5"] .ctas .b:nth-child(2) { color: #00ff00; }
  [data-t="5"] .ctas .b:nth-child(4) { color: #ffff00; } [data-t="5"] .ctas .b:nth-child(5) { color: #00ffff; }
  [data-t="5"] .b:hover { background: #fff; color: #000 !important; }
  [data-t="5"] .list .row.sel { background: #ffff00; color: #000; }

  /* ================= 6 · Relay circuit ================= */
  [data-t="6"] { --pg: #120c1a; --fg: #f1ecf7; --dim: #a99bbd; --ln: #3d2c55; --pri: #c8ff00; --prifg: #0b0b0c; }
  [data-t="6"] .win { border: 1px solid #3d2c55; box-shadow: 12px 12px 0 rgba(0,0,0,.55); }
  [data-t="6"] .win.focus { border-color: #9a6bd8; }
  [data-t="6"] .ch { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #2a1a3d; font-size: 12px; }
  [data-t="6"] .ch .on { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #c79bff; box-shadow: inset 0 0 0 2px #2a1a3d, inset 0 0 0 4px #c79bff; }
  [data-t="6"] .ch .f { flex: 1; padding: 5px 9px; background: #120c1a; border: 1px solid #3d2c55; }
  [data-t="6"] .ch .f b { font-weight: normal; color: #c8ff00; }
  [data-t="6"] .ch .x { background: none; border: 0; color: #a99bbd; font: inherit; cursor: pointer; }
  [data-t="6"] .circ { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 9px 12px; background: #1b1127; border-bottom: 1px solid #3d2c55; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #a99bbd; }
  [data-t="6"] .circ i { font-style: normal; color: #f1ecf7; border: 1px solid #3d2c55; padding: 2px 6px; }
  [data-t="6"] .circ .ar { color: #6e5a8a; }
  [data-t="6"] .circ .ok { margin-left: auto; color: #c8ff00; }
  [data-t="6"] .b:hover { background: #c79bff; color: #120c1a; }

  /* ================= 7 · PGP signed ================= */
  [data-t="7"] { --pg: #f4f1e8; --fg: #111; --dim: #55534d; --ln: #111; --pri: #111; --prifg: #f4f1e8; }
  [data-t="7"] .win { border: 1px solid #111; box-shadow: 12px 12px 0 rgba(0,0,0,.5); }
  [data-t="7"] .ch { display: flex; align-items: center; gap: 10px; padding: 7px 10px; background: #e3dfd2; border-bottom: 1px solid #111; font-size: 12px; }
  [data-t="7"] .ch .x { width: 10px; height: 10px; border: 1px solid #111; background: #fff; padding: 0; cursor: pointer; }
  [data-t="7"] .ch .v { margin-left: auto; color: #2d6a00; }
  [data-t="7"] .pre, [data-t="7"] .post { color: #111; }
  [data-t="7"] .sig { color: #55534d; word-break: break-all; }
  [data-t="7"] .good { margin-top: 8px; display: inline-block; padding: 2px 6px; background: #c8ff00; color: #111; }

  /* ================= 8 · Redacted ================= */
  [data-t="8"] { --pg: #fbfbf8; --fg: #111; --dim: #44443f; --ln: #111; --pri: #111; --prifg: #fff; }
  [data-t="8"] .win { border: 1px solid #111; box-shadow: 12px 12px 0 rgba(0,0,0,.5); font-family: var(--mono); }
  [data-t="8"] .ch { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-bottom: 3px double #111; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
  [data-t="8"] .ch .x { background: none; border: 0; font: inherit; cursor: pointer; }
  [data-t="8"] .ch .st { margin-left: auto; color: #c4161c; border: 2px solid #c4161c; padding: 1px 6px; transform: rotate(-3deg); }
  [data-t="8"] .pre { color: #111; letter-spacing: .1em; text-transform: uppercase; font-size: 11px; display: flex; justify-content: space-between; }
  [data-t="8"] .rx { background: #111; color: transparent; transition: background .25s, color .25s; cursor: help; }
  [data-t="8"] .rx:hover, [data-t="8"] .copy:hover .rx { background: #c8ff00; color: #111; }

  /* ================= 9 · Ciphertext ================= */
  [data-t="9"] { --pg: #0c0e11; --fg: #e9ecef; --dim: #8b939c; --ln: #2a3038; --pri: #c8ff00; --prifg: #0b0b0c; }
  [data-t="9"] .win { border: 1px solid #2a3038; box-shadow: 12px 12px 0 rgba(0,0,0,.6); }
  [data-t="9"] .win.focus { border-color: #c8ff00; }
  [data-t="9"] .ch { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #14181d; border-bottom: 1px solid #2a3038; font-size: 12px; }

let m = null;

const sizeHero = () => {
  heroEl.style.width = "100%";
  const w = heroEl.parentElement.getBoundingClientRect().width;

function startHero() {
  sizeHero();

  m = mosh(heroEl, (c, W, H) => {
    c.fillStyle = hb; c.fillRect(0, 0, W, H);
    const padX = Math.round(W * .037);

    c.font = `${s}px "Departure Mono"`; c.textBaseline = "top"; c.fillStyle = hi;
    const y = Math.round(H * .14);

    c.fillStyle = ha; c.fillRect(padX, Math.round(y + s * .92), Math.round(W * .5), Math.max(2, Math.round(s * .07)));
  }, { scale: 3, fps: 14, decay: .9, floor: .025, palette: [hex(hb), hex(hi), hex(ha)] });
  m.corrupt();
  heroEl.addEventListener("pointermove", (e) => m.kick(Math.hypot(e.movementX, e.movementY) * .004));
}

// ---------- 9: ciphertext while the camera can see you ----------
let setWatched = () => {};
if (V === 9) {
  const els = [...document.querySelectorAll("#main [data-c]")];
  const nodes = [];
  for (const el of els) {
    const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    while (w.nextNode()) if (w.currentNode.textContent.trim()) nodes.push({ n: w.currentNode, s: w.currentNode.textContent, p: 1 });
  }
  const glyph = "0123456789abcdef";
  // reading order: top to bottom, then left to right within a row
  const pos = (o) => { const r = document.createRange(); r.selectNodeContents(o.n); return r.getBoundingClientRect(); };
  nodes.forEach((o) => { const r = pos(o); o.top = r.top; o.left = r.left; });
  nodes.sort((x, y) => (Math.abs(x.top - y.top) > 8 ? x.top - y.top : x.left - y.left));
  // the subtitle decrypts on its own fast clock; everything else shares one reading-order sweep

  const label = (enc) => { cs.textContent = enc ? "encrypted · verifying stack e2e" : "stack e2e verified secure"; cs.classList.toggle("locked", enc); };
  setWatched = (v) => { if (v === watched) return; watched = v; since = performance.now(); if (v) { f = 0; ff = 0; } };
  // subtitle: scrambled 0.3 s, readable by 0.7 s. The rest: scrambled 0.6 s, then top-left to bottom-right, done by 2 s
  (function tick() {
    const t = performance.now() - since;
    const ramp = (a, b) => Math.max(0, Math.min(1, (t - a) / (b - a)));
    if (watched) { f = ramp(600, 2000); ff = ramp(300, 700); } else { f = Math.min(1, f + .08); ff = Math.min(1, ff + .15); }
    const enc = f < 1 || ff < 1;
    if (cs.classList.contains("locked") !== enc) label(enc);
    const shown = Math.floor(total * f), fastShown = Math.floor(fastTotal * ff);
    for (const o of nodes) {
      const cut = Math.max(0, Math.min(o.s.length, (o.fast ? fastShown : shown) - o.off));
      if (cut === o.s.length) { if (o.n.textContent !== o.s) o.n.textContent = o.s; continue; }
      o.n.textContent = o.s.slice(0, cut) + [...o.s.slice(cut)].map((ch) => (ch === " " ? " " : glyph[Math.random() * 16 | 0])).join("");
    }
    setTimeout(tick, 50);
  })();
  setWatched(true);
}

// ---------- tracks: sealed until the sponsors lock them ----------
const list = document.getElementById("list"), info = document.getElementById("info");
const sealed = Array.from({ length: 4 }, (_, i) => {
  const row = document.createElement("div");
  row.className = "row";
  row.innerHTML = `<span></span><span class="g">sealed</span>`;
  row.addEventListener("click", () => {
    list.querySelectorAll(".row").forEach((r) => r.classList.toggle("sel", r === row));
    info.innerHTML = `<div class="k">Track 0${i + 1} · sealed</div>Decrypts when its sponsor locks it in. Want to set one? <a href="sponsor.html">Sponsor a track →</a>`;
  });
  list.appendChild(row);
  return row.firstChild;
});
const hexg = "0123456789abcdef";
(function scramble() {
  for (const el of sealed) el.textContent = Array.from({ length: 14 }, () => hexg[Math.random() * 16 | 0]).join("").replace(/(.{4})/g, "$1 ").trim();
  setTimeout(scramble, 220);
})();

// ---------- windows ----------
let z = 20;
const focus = (w) => { document.querySelectorAll(".win").forEach((o) => o.classList.toggle("focus", o === w)); w.style.zIndex = ++z; };
function open(id) {
  const w = document.getElementById(id);
  if (w.hidden) {
    w.hidden = false;
    if (!w.dataset.placed) {
      const mainEl = document.getElementById("main");
      let main = mainEl.getBoundingClientRect();
      const col = 480;
      if (innerWidth >= main.width + col + 72 && !mainEl.dataset.moved) {
        mainEl.dataset.moved = 1;
        const left = Math.max(24, (innerWidth - main.width - col - 24) / 2);
        mainEl.style.transform = "none"; mainEl.style.left = main.left + "px"; mainEl.style.top = main.top + "px";
        mainEl.getBoundingClientRect();
        mainEl.style.transition = "left .45s cubic-bezier(.2,.8,.2,1)";
        mainEl.style.left = left + "px";
        main = { left, right: left + main.width, top: main.top, bottom: main.bottom };
      }
      const beside = innerWidth >= main.right + 24 + 340;
      const x = beside ? main.right + 24 : Math.min(innerWidth - w.offsetWidth - 16, main.right - 120);
      const tr = document.getElementById("tracks");
      const below = id === "schedule" && !tr.hidden ? tr.getBoundingClientRect().bottom + 18 : main.top + 250;
      const y = id === "tracks" ? Math.max(60, main.top - 30) : Math.min(innerHeight - w.offsetHeight - 24, below);
      w.style.left = Math.max(16, x + (id === "schedule" ? 40 : 0)) + "px"; w.style.top = y + "px"; w.dataset.placed = 1;
    }
    m?.kick(.5);
  }
  focus(w);
}
document.querySelectorAll("[data-open]").forEach((b) => {
  b.addEventListener("pointerdown", (e) => e.stopPropagation());
  b.addEventListener("click", (e) => { e.stopPropagation(); open(b.dataset.open); });
});
document.querySelectorAll(".pop [data-x]").forEach((b) => b.addEventListener("click", (e) => {
  e.stopPropagation();
  b.closest(".win").hidden = true;
  const mainEl = document.getElementById("main");
  focus(mainEl);
  if (![...document.querySelectorAll(".pop")].some((w) => !w.hidden) && mainEl.dataset.moved && !mainEl.dataset.dragged) {
    mainEl.style.transition = "left .45s cubic-bezier(.2,.8,.2,1)";
    mainEl.style.left = Math.round((innerWidth - mainEl.offsetWidth) / 2) + "px";
    delete mainEl.dataset.moved;
    document.querySelectorAll(".pop").forEach((w) => delete w.dataset.placed);
  }
}));
document.querySelectorAll(".win").forEach((w) => {
  w.addEventListener("pointerdown", () => focus(w));
  const bar = w.querySelector(".ch");
  let drag = null;
  bar.style.cursor = "grab"; bar.style.userSelect = "none";
  bar.addEventListener("pointerdown", (e) => { if (e.target.closest("button") || (w.id === "main" && matchMedia("(max-width: 640px)").matches)) return; const r = w.getBoundingClientRect(); drag = [e.clientX - r.left, e.clientY - r.top]; bar.setPointerCapture(e.pointerId); });
  bar.addEventListener("pointermove", (e) => { if (!drag) return; w.dataset.dragged = 1; w.style.transition = "none"; w.style.transform = "none"; w.style.left = e.clientX - drag[0] + "px"; w.style.top = e.clientY - drag[1] + "px"; });
  bar.addEventListener("pointerup", () => { drag = null; });
});

// ---------- HUD ----------
const clock = document.getElementById("clock");
setInterval(() => {
  const now = new Date();
  clock.innerHTML = now.toISOString().replace("T", " ").slice(0, 19) + "Z<br>FRAME " + Math.floor(performance.now() / 41.7);
  document.querySelectorAll("[data-clock]").forEach((el) => { el.textContent = "Sat 07 Nov " + now.toTimeString().slice(0, 8); });
}, 250);
const ret = document.getElementById("ret"), label = document.getElementById("retlabel");
let rx = innerWidth / 2, ry = innerHeight / 2, mx = rx, my = ry;
addEventListener("pointermove", (e) => {
  mx = e.clientX; my = e.clientY;
  const inside = !!e.target.closest(".win");
  ret.classList.toggle("lost", inside);
  setWatched(!inside);
  if (inside) t.mheat = 0;
});
(function follow() {
  rx += (mx - rx) * .09; ry += (my - ry) * .09;
  ret.style.left = rx + "px"; ret.style.top = ry + "px";
  label.textContent = "SUBJECT 08 // " + (36.4 + Math.random() * .4).toFixed(1) + "°C";
  requestAnimationFrame(follow);
})();
</script>
