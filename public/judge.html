<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Judging · LOCALHOST</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="https://localhostai.nyc/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0c0e11">
<link rel="stylesheet" href="shared/base.css">
<style>
  @font-face { font-family: "IBM Plex Mono"; src: url("fonts/IBMPlexMono-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "IBM Plex Mono"; src: url("fonts/IBMPlexMono-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }
  :root { --bg: #0c0e11; --panel: #12161b; --line: #2a3038; --hi: #f2f4f6; --mid: #a7b0ba; --lo: #6b747e; --bad: #ff6b6b; --read: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
  html, body { height: auto; }
  body { background: var(--bg); color: var(--hi); font-family: var(--read); -webkit-font-smoothing: antialiased; padding-bottom: env(safe-area-inset-bottom); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 120px; }
  header { position: sticky; top: 0; z-index: 20; background: rgba(12,14,17,.96); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); margin: 0 -16px; padding: 12px 16px 0; }
  .top { display: flex; align-items: center; gap: 10px; font: 11px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--lo); }
  .top .me { color: var(--hi); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sync { flex: none; padding: 3px 8px; border: 1px solid var(--line); }
  .sync.ok { color: var(--acid); border-color: #3b4a10; } .sync.busy { color: var(--mid); } .sync.off { color: var(--bad); border-color: #5a2a2a; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; font: 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; padding: 9px 12px; border: 1px solid var(--line); background: none; color: var(--mid); cursor: pointer; }
  .tab.on { border-color: var(--acid); color: var(--acid); }
  .tab .d { color: var(--lo); margin-left: 6px; } .tab.on .d { color: var(--acid); }
  .head { padding: 16px 0 6px; }
  .head h1 { font: 600 22px/1.25 var(--read); }
  .head .how { margin-top: 6px; font-size: 13px; color: var(--mid); }
  .picks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 12px 0 4px; }
  .pick { border: 1px solid var(--line); padding: 8px; min-height: 52px; font-size: 12px; color: var(--lo); overflow: hidden; }
  .pick b { display: block; font: 11px var(--mono); letter-spacing: .12em; color: var(--acid); margin-bottom: 3px; }
  .pick.set { color: var(--hi); border-color: #3b4a10; }
  .card { margin-top: 10px; border: 1px solid var(--line); background: var(--panel); padding: 14px; scroll-margin-top: 130px; }
  .card.now { border-color: var(--acid); box-shadow: inset 4px 0 0 var(--acid); }
  .card .n { font: 11px var(--mono); letter-spacing: .16em; color: var(--lo); display: flex; justify-content: space-between; }
  .card.now .n .live { color: var(--acid); }
  .card h2 { font: 600 20px/1.25 var(--read); margin-top: 6px; overflow-wrap: anywhere; }
  .card .pt { margin-top: 6px; font-size: 14px; line-height: 1.45; color: var(--mid); }
  .links { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .lk { font: 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; padding: 10px 12px; border: 1px solid var(--line); color: var(--hi); text-decoration: none; background: none; cursor: pointer; }
  .lk.play { border-color: var(--acid); color: var(--acid); }
  .lk.none { color: var(--lo); border-style: dashed; cursor: default; }
  .rank { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; }
  .rk { font: 15px var(--mono); letter-spacing: .06em; padding: 14px 0; border: 1px solid #3a424c; background: none; color: var(--hi); cursor: pointer; touch-action: manipulation; }
  .rk.on { background: var(--acid); color: #0b0b0c; border-color: var(--acid); }
  .star { width: 100%; margin-top: 12px; font: 15px var(--mono); letter-spacing: .08em; text-transform: uppercase; padding: 14px 0; border: 1px solid #3a424c; background: none; color: var(--hi); cursor: pointer; touch-action: manipulation; }
  .star.on { background: var(--acid); color: #0b0b0c; border-color: var(--acid); }
  .note { width: 100%; margin-top: 8px; font: 14px var(--read); padding: 11px; background: #000; color: var(--hi); border: 1px solid var(--line); border-radius: 0; }
  .note:focus { outline: 1px solid var(--acid); border-color: var(--acid); }
  .note::placeholder { color: var(--lo); }
  .empty, .bad { padding: 40px 0; color: var(--mid); font-size: 14px; line-height: 1.6; }
  .bad b { color: var(--bad); font-weight: 500; }
  .jump { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 30; font: 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 12px 16px; background: var(--acid); color: #0b0b0c; border: 0; max-width: calc(100vw - 32px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; box-shadow: 0 6px 24px rgba(0,0,0,.6); }
  .vid { position: fixed; inset: 0; z-index: 50; background: #000; display: flex; flex-direction: column; }
  .vid video { flex: 1; width: 100%; min-height: 0; background: #000; }
  .vid button { font: 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; padding: 14px; background: #111; color: var(--hi); border: 0; border-top: 1px solid var(--line); }
  .sc { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .sc .pz { font: 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--acid); display: flex; justify-content: space-between; }
  .sc .pz .st { color: var(--lo); }
  .nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
  .num { font: 18px var(--mono); padding: 13px 0; border: 1px solid #3a424c; background: none; color: var(--hi); cursor: pointer; touch-action: manipulation; }
  .num.on { background: var(--acid); color: #0b0b0c; border-color: var(--acid); }
  .scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--lo); margin-top: 4px; }
  .tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; font: 11px var(--mono); letter-spacing: .06em; }
  .tag { padding: 3px 7px; border: 1px solid var(--line); color: var(--mid); }
  .tag.mine { border-color: #3b4a10; color: var(--acid); }
  .watch { margin-top: 12px; font-size: 13px; color: var(--lo); border: 1px dashed var(--line); padding: 10px; }
  .card video, .card iframe { width: 100%; aspect-ratio: 16/9; margin-top: 12px; background: #000; border: 0; display: block; }
  .sum h2 { font: 600 18px/1.3 var(--read); margin: 28px 0 4px; }
  .sum table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .sum td { padding: 8px 4px; border-top: 1px solid var(--line); vertical-align: middle; }
  .sum td.t { color: var(--hi); } .sum td.t a { color: inherit; }
  .sum .mini { display: flex; gap: 4px; justify-content: flex-end; }
  .sum .mini .num { font-size: 14px; padding: 8px 10px; }
  .who { padding: 60px 0; display: grid; gap: 12px; }
  .who input { font: 18px var(--read); padding: 12px; background: #000; color: var(--hi); border: 1px solid var(--line); }
  .who button { font: 13px var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 13px; background: var(--acid); color: #0b0b0c; border: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header id="hdr" hidden>
    <div class="top"><span>LOCALHOST</span><span class="me" id="me"></span><span class="sync ok" id="sync">saved</span></div>
    <nav class="tabs" id="tabs"><button class="tab on" type="button" data-to="list">Projects</button><button class="tab" type="button" data-to="sum">My scores <span class="d" id="cnt"></span></button><button class="tab" type="button" id="refresh">↻ new projects</button></nav>
  </header>
  <main id="main"><p class="empty">Loading…</p></main>
</div>
<button class="jump" id="jump" type="button" hidden></button>

<script type="module">
import { FORMS_API } from "./shared/forms.js";
import { embedUrl } from "./shared/projects.js";
// /judge?j=<first name>. Every project is shown; a project gets 1-4 score buttons for each prize it
// entered that this judge judges (GPCC Forms src/lib/judging.ts JUDGES). Each tap saves to this phone
// first, then to the server, retrying until it lands. "My scores" lists every score to change later.
const API = `${FORMS_API}/api/f/localhost-project/judging/`;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const code = (new URLSearchParams(location.search).get("j") || "").trim().toLowerCase();
const QKEY = "lh-judge-queue:" + code;
const SHORT = (p) => (p.id.startsWith("bounty:") ? p.name : p.name);
const post = async (path, body) => {
  const r = await fetch(API + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code, ...body }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.ok) { const e = new Error(j.error || "HTTP " + r.status); e.status = r.status; throw e; }
  return j;
};

if (!code) {
  $("main").innerHTML = `<form class="who" id="who"><p class="head"><b>Judging · LOCALHOST</b></p><label>Your first name<br><input id="nm" autocomplete="given-name" autocapitalize="off"></label><button>Start judging</button></form>`;
  $("who").onsubmit = (e) => { e.preventDefault(); const v = $("nm").value.trim().toLowerCase(); if (v) location.search = "?j=" + encodeURIComponent(v); };
  throw new Error("no code");
}

let D, mine, scores = {}; // scores["prize|entry"] = {score, note}
const k = (prize, entry) => prize + "|" + entry;
let queue = {};
try { queue = JSON.parse(localStorage.getItem(QKEY) || "{}"); } catch {}
const saveQ = () => { try { localStorage.setItem(QKEY, JSON.stringify(queue)); } catch {} };

async function load() {
  try { D = await post("me", {}); }
  catch (e) {
    $("main").innerHTML = e.status === 404 ? `<p class="bad"><b>“${esc(code)}” isn't a judge.</b><br>Use your first name, e.g. localhostai.nyc/judge?j=veljko</p>` : `<p class="bad"><b>Couldn't load.</b> ${esc(e.message)}. Pull to reload.</p>`;
    return;
  }
  mine = new Map(D.prizes.map((p) => [p.id, p]));
  scores = {};
  for (const [prize, b] of Object.entries(D.ballots || {})) for (const [entry, v] of Object.entries(b.ballot || {})) scores[k(prize, entry)] = v;
  for (const [kk, v] of Object.entries(queue)) scores[kk] = v; // unsent taps win
  $("hdr").hidden = false;
  $("me").textContent = `${D.judge.label} · ${D.prizes.map(SHORT).join(", ")}`;
  render();
  flush();
}

const prizeName = (id) => (D.allPrizes.find((p) => p.id === id) || { name: id }).name;
const tagName = (id) => (id.startsWith("bounty:") ? prizeName(id) : prizeName(id).split(" ")[0]);
function buttons(prize, entry, cls = "nums") {
  const v = scores[k(prize, entry)] || {};
  return `<div class="${cls}">${[1, 2, 3, 4].map((n) => `<button type="button" class="num${v.score === n ? " on" : ""}" data-p="${esc(prize)}" data-e="${esc(entry)}" data-s="${n}">${n}</button>`).join("")}</div>`;
}
function video(p) {
  if (p.file) return `<video controls playsinline preload="none" src="${esc(p.file)}"></video>`;
  if (p.video) { const em = embedUrl(p.video); return em ? `<iframe src="${esc(em.replace("autoplay=1", "autoplay=0"))}" allow="fullscreen; picture-in-picture" loading="lazy"></iframe>` : `<div class="links"><a class="lk play" href="${esc(p.video)}" target="_blank" rel="noopener noreferrer">▶ demo (new tab)</a></div>`; }
  return `<div class="links"><span class="lk none">no demo video</span></div>`;
}
function card(p) {
  const judgeable = p.prizes.filter((id) => mine.has(id));
  const others = p.prizes.filter((id) => !mine.has(id));
  return `<article class="card${D.now === p.entry ? " now" : ""}" id="c-${esc(p.entry)}">
    <div class="n"><span>${String(p.n).padStart(2, "0")}</span>${D.now === p.entry ? '<span class="live">ON SCREEN</span>' : ""}</div>
    <h2>${esc(p.team)}</h2><p class="pt">${esc(p.pitch)}</p>
    <div class="tags">${p.prizes.map((id) => `<span class="tag${mine.has(id) ? " mine" : ""}">${esc(tagName(id))}</span>`).join("")}</div>
    ${video(p)}
    <div class="links">${p.repo ? `<a class="lk" href="${esc(p.repo)}" target="_blank" rel="noopener noreferrer">repo ↗</a>` : ""}</div>
    ${judgeable.map((id) => { const v = scores[k(id, p.entry)] || {}; return `<div class="sc"><div class="pz"><span>${esc(prizeName(id))}</span><span class="st">${v.score ? "scored " + v.score : "not scored"}</span></div>${buttons(id, p.entry)}<div class="scale"><span>1 weak</span><span>4 great</span></div>
      <input class="note" maxlength="280" placeholder="note (optional)" data-p="${esc(id)}" data-e="${esc(p.entry)}" value="${esc(v.note || "")}"></div>`; }).join("")}
    ${!judgeable.length ? `<div class="watch">You're not judging this one${others.length ? ` (entered: ${others.map(tagName).map(esc).join(", ")})` : ""}. Watch only.</div>` : others.length ? `<div class="watch">Also entered: ${others.map(tagName).map(esc).join(", ")} (not yours)</div>` : ""}
  </article>`;
}
function summary() {
  let total = 0, done = 0;
  const html = D.prizes.map((pz) => {
    const ps = D.projects.filter((p) => p.prizes.includes(pz.id));
    total += ps.length; done += ps.filter((p) => scores[k(pz.id, p.entry)]?.score).length;
    return `<h2>${esc(pz.name)}</h2><table>${ps.length ? ps.map((p) => `<tr><td class="t"><a href="#c-${esc(p.entry)}">${esc(p.team)}</a></td><td>${buttons(pz.id, p.entry, "mini")}</td></tr>`).join("") : '<tr><td class="t">No entries.</td></tr>'}</table>`;
  }).join("");
  $("cnt").textContent = `${done}/${total}`;
  return `<section class="sum" id="sum"><h2 style="font-size:22px">My scores · ${done}/${total}</h2><p class="pt" style="color:var(--mid);font-size:13px">Tap any number to change it. Every tap is saved.</p>${html}</section>`;
}
function render() {
  const y = scrollY, focused = document.activeElement?.classList.contains("note") ? [document.activeElement.dataset.p, document.activeElement.dataset.e] : null;
  $("main").innerHTML = `<section id="list"><div class="head"><h1>Score 1–4</h1><p class="how">Each project shows a row of 1–4 for every prize it entered that you judge. 4 = great. Scores save as you tap.</p></div>${D.projects.length ? D.projects.map(card).join("") : '<p class="empty">No projects yet.</p>'}</section>${summary()}`;
  scrollTo(0, y);
  if (focused) document.querySelector(`.note[data-p="${focused[0]}"][data-e="${focused[1]}"]`)?.focus();
  jumpBtn();
}

// After a tap: update just that score's buttons, label and the count, so a playing video keeps playing.
function paint(prize, entry) {
  const v = scores[k(prize, entry)] || {};
  for (const b of document.querySelectorAll(`.num[data-p="${CSS.escape(prize)}"][data-e="${CSS.escape(entry)}"]`)) b.classList.toggle("on", Number(b.dataset.s) === v.score);
  const st = document.querySelector(`#c-${CSS.escape(entry)} .sc .num[data-p="${CSS.escape(prize)}"]`)?.closest(".sc")?.querySelector(".st");
  if (st) st.textContent = v.score ? "scored " + v.score : "not scored";
  let total = 0, done = 0;
  for (const pz of D.prizes) for (const p of D.projects) if (p.prizes.includes(pz.id)) { total++; if (scores[k(pz.id, p.entry)]?.score) done++; }
  $("cnt").textContent = `${done}/${total}`;
  const h = document.querySelector("#sum > h2"); if (h) h.textContent = `My scores · ${done}/${total}`;
}
function setScore(prize, entry, patch) {
  const cur = { ...(scores[k(prize, entry)] || {}) };
  Object.assign(cur, patch);
  if (!cur.score) delete cur.score;
  if (!cur.note) delete cur.note;
  scores[k(prize, entry)] = cur;
  queue[k(prize, entry)] = cur;
  saveQ();
  flush();
}
let sending = false, delay = 1000;
const sync = (cls, t) => { $("sync").className = "sync " + cls; $("sync").textContent = t; };
async function flush() {
  if (sending) return;
  const keys = Object.keys(queue);
  if (!keys.length) return sync("ok", "saved ✓");
  sending = true; sync("busy", "saving…");
  try {
    for (const kk of keys) {
      const v = queue[kk];
      const [prize, entry] = kk.split("|");
      try { await post("ballot", { prize, entry, score: v.score ?? null, note: v.note || "" }); }
      catch (e) { if (e.status && e.status < 500 && e.status !== 429) { sync("off", e.message); delete queue[kk]; saveQ(); continue; } throw e; }
      if (queue[kk] === v) delete queue[kk];
      saveQ();
    }
    delay = 1000; sending = false;
    if (Object.keys(queue).length) return flush();
    sync("ok", "saved ✓");
  } catch {
    sending = false; sync("off", "offline · retrying");
    setTimeout(flush, delay); delay = Math.min(delay * 2, 15000);
  }
}
document.addEventListener("click", (e) => {
  const b = e.target.closest(".num");
  if (b) {
    const n = Number(b.dataset.s), cur = scores[k(b.dataset.p, b.dataset.e)]?.score;
    setScore(b.dataset.p, b.dataset.e, { score: cur === n ? 0 : n });
    paint(b.dataset.p, b.dataset.e);
    return;
  }
  const t = e.target.closest(".tab");
  if (t) { for (const x of document.querySelectorAll(".tab")) x.classList.toggle("on", x === t); $(t.dataset.to)?.scrollIntoView({ behavior: "smooth" }); }
});
let noteT;
document.addEventListener("input", (e) => {
  if (!e.target.classList.contains("note")) return;
  const { p, e: en } = e.target.dataset, v = e.target.value;
  clearTimeout(noteT);
  noteT = setTimeout(() => setScore(p, en, { note: v.trim() }), 700);
});
window.addEventListener("online", flush);

// The team on the big screen (set by Present on /projects): highlight it, offer a jump.
function jumpBtn() {
  const p = D.projects.find((x) => x.entry === D.now);
  const j = $("jump");
  if (!p) { j.hidden = true; return; }
  j.hidden = false; j.textContent = `On screen: ${p.team} ↓`;
  j.onclick = () => document.getElementById("c-" + p.entry)?.scrollIntoView({ behavior: "smooth", block: "start" });
}
setInterval(async () => {
  if (!D) return;
  try {
    const { now } = await post("now", {});
    if (now !== D.now) {
      D.now = now;
      for (const c of document.querySelectorAll(".card")) c.classList.toggle("now", c.id === "c-" + now);
      jumpBtn();
    }
  } catch {}
}, 5000);
$("refresh").onclick = () => load();
load();
</script>
</body>
</html>
