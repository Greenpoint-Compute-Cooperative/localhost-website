<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Judging · LOCALHOST</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="https://localhostai.nyc/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0c0e11">
<link rel="stylesheet" href="shared/base.css">
<style>
  @font-face { font-family: "IBM Plex Mono"; src: url("fonts/IBMPlexMono-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "IBM Plex Mono"; src: url("fonts/IBMPlexMono-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }
  :root { --bg: #0c0e11; --panel: #12161b; --line: #2a3038; --hi: #f2f4f6; --mid: #a7b0ba; --lo: #6b747e; --bad: #ff6b6b; --read: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
  html, body { height: auto; }
  body { background: var(--bg); color: var(--hi); font-family: var(--read); -webkit-font-smoothing: antialiased; padding-bottom: env(safe-area-inset-bottom); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 120px; }
  header { position: sticky; top: 0; z-index: 20; background: rgba(12,14,17,.96); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); margin: 0 -16px; padding: 12px 16px 0; }
  .top { display: flex; align-items: center; gap: 10px; font: 11px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--lo); }
  .top .me { color: var(--hi); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sync { flex: none; padding: 3px 8px; border: 1px solid var(--line); }
  .sync.ok { color: var(--acid); border-color: #3b4a10; } .sync.busy { color: var(--mid); } .sync.off { color: var(--bad); border-color: #5a2a2a; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; font: 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; padding: 9px 12px; border: 1px solid var(--line); background: none; color: var(--mid); cursor: pointer; }
  .tab.on { border-color: var(--acid); color: var(--acid); }
  .tab .d { color: var(--lo); margin-left: 6px; } .tab.on .d { color: var(--acid); }
  .head { padding: 16px 0 6px; }
  .head h1 { font: 600 22px/1.25 var(--read); }
  .head .how { margin-top: 6px; font-size: 13px; color: var(--mid); }
  .picks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 12px 0 4px; }
  .pick { border: 1px solid var(--line); padding: 8px; min-height: 52px; font-size: 12px; color: var(--lo); overflow: hidden; }
  .pick b { display: block; font: 11px var(--mono); letter-spacing: .12em; color: var(--acid); margin-bottom: 3px; }
  .pick.set { color: var(--hi); border-color: #3b4a10; }
  .card { margin-top: 10px; border: 1px solid var(--line); background: var(--panel); padding: 14px; scroll-margin-top: 130px; }
  .card.now { border-color: var(--acid); box-shadow: inset 4px 0 0 var(--acid); }
  .card .n { font: 11px var(--mono); letter-spacing: .16em; color: var(--lo); display: flex; justify-content: space-between; }
  .card.now .n .live { color: var(--acid); }
  .card h2 { font: 600 20px/1.25 var(--read); margin-top: 6px; overflow-wrap: anywhere; }
  .card .pt { margin-top: 6px; font-size: 14px; line-height: 1.45; color: var(--mid); }
  .links { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .lk { font: 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; padding: 10px 12px; border: 1px solid var(--line); color: var(--hi); text-decoration: none; background: none; cursor: pointer; }
  .lk.play { border-color: var(--acid); color: var(--acid); }
  .lk.none { color: var(--lo); border-style: dashed; cursor: default; }
  .rank { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; }
  .rk { font: 15px var(--mono); letter-spacing: .06em; padding: 14px 0; border: 1px solid #3a424c; background: none; color: var(--hi); cursor: pointer; touch-action: manipulation; }
  .rk.on { background: var(--acid); color: #0b0b0c; border-color: var(--acid); }
  .star { width: 100%; margin-top: 12px; font: 15px var(--mono); letter-spacing: .08em; text-transform: uppercase; padding: 14px 0; border: 1px solid #3a424c; background: none; color: var(--hi); cursor: pointer; touch-action: manipulation; }
  .star.on { background: var(--acid); color: #0b0b0c; border-color: var(--acid); }
  .note { width: 100%; margin-top: 8px; font: 14px var(--read); padding: 11px; background: #000; color: var(--hi); border: 1px solid var(--line); border-radius: 0; }
  .note:focus { outline: 1px solid var(--acid); border-color: var(--acid); }
  .note::placeholder { color: var(--lo); }
  .empty, .bad { padding: 40px 0; color: var(--mid); font-size: 14px; line-height: 1.6; }
  .bad b { color: var(--bad); font-weight: 500; }
  .jump { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 30; font: 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 12px 16px; background: var(--acid); color: #0b0b0c; border: 0; max-width: calc(100vw - 32px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; box-shadow: 0 6px 24px rgba(0,0,0,.6); }
  .vid { position: fixed; inset: 0; z-index: 50; background: #000; display: flex; flex-direction: column; }
  .vid video { flex: 1; width: 100%; min-height: 0; background: #000; }
  .vid button { font: 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; padding: 14px; background: #111; color: var(--hi); border: 0; border-top: 1px solid var(--line); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header id="hdr" hidden>
    <div class="top"><span>LOCALHOST</span><span class="me" id="me"></span><span class="sync ok" id="sync">saved</span></div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="main"><p class="empty">Loading…</p></main>
</div>
<button class="jump" id="jump" type="button" hidden></button>
<div class="vid" id="vid" hidden><video id="video" controls playsinline></video><button type="button" id="vclose">Close</button></div>

<script type="module">
import { FORMS_API } from "./shared/forms.js";
// Judge links: /judge?j=<code>, made on /projects. Ballots save to this phone first, then to GPCC Forms
// (src/lib/judging.ts); a failed save retries until it lands. The team on the big screen is polled.
const API = `${FORMS_API}/api/f/localhost-project/judging/`;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const q = new URLSearchParams(location.search);
const code = (q.get("j") || store.get("localhost-judge-code") || "").trim().toLowerCase();
const RK = ["1st", "2nd", "3rd"];
const SHORT = { t01: "01 Agentic org", t21: "2.1 Production", t22: "2.2 Own model", t23: "2.3 Inference", t24: "2.4 Cooperation" };
let data = null, tab = null, now = null;
const ballots = {};   // prize -> {entry: {rank?, star?, note?}}
const dirty = new Set();

const post = async (path, body) => {
  const r = await fetch(API + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code, ...body }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.ok) throw Object.assign(new Error(j.error || `HTTP ${r.status}`), { status: r.status });
  return j;
};
const lsKey = (prize) => `localhost-judge:${code}:${prize}`;

function sync(state, text) { const s = $("sync"); s.className = "sync " + state; s.textContent = text; }

async function load() {
  if (!/^[a-z2-7]{26}$/.test(code)) { $("main").innerHTML = '<p class="bad"><b>No judge link.</b> Open the link an organizer sent you.</p>'; return; }
  try { data = await post("me", {}); }
  catch (e) {
    $("main").innerHTML = e.status === 404 ? `<p class="bad"><b>This judge link isn't active.</b> Ask an organizer for a new one.</p>` : `<p class="bad"><b>Can't reach the server.</b> Check the wifi; this page retries.</p>`;
    if (e.status !== 404) setTimeout(load, 5000);
    return;
  }
  store.set("localhost-judge-code", code);
  if (q.get("j")) history.replaceState(null, "", location.pathname + "?j=" + code);
  for (const p of data.prizes) {
    const server = data.ballots[p.id] || { ballot: {}, at: 0 };
    const local = store.get(lsKey(p.id));
    // Unsaved changes on this phone win over the server copy; otherwise the server's.
    if (local && local.dirty && (local.at || 0) >= server.at) { ballots[p.id] = local.ballot; dirty.add(p.id); }
    else ballots[p.id] = server.ballot;
  }
  now = data.now;
  tab = data.prizes.some((p) => p.id === store.get(`localhost-judge-tab:${code}`)) ? store.get(`localhost-judge-tab:${code}`) : data.prizes[0]?.id;
  $("me").textContent = data.judge.label;
  $("hdr").hidden = false;
  render();
  if (dirty.size) flush();
  else sync("ok", "saved");
}

const projectBy = (e) => data.projects.find((p) => p.entry === e);

function render() {
  $("tabs").innerHTML = data.prizes.length > 1 ? data.prizes.map((p) => {
    const b = ballots[p.id] || {};
    const done = p.kind === "rank" ? Object.values(b).filter((x) => x.rank).length + "/" + Math.min(3, p.entries.length) : Object.values(b).filter((x) => x.star).length + "★";
    return `<button class="tab${p.id === tab ? " on" : ""}" data-tab="${esc(p.id)}">${esc(SHORT[p.id] || p.name)}<span class="d">${done}</span></button>`;
  }).join("") : "";
  const p = data.prizes.find((x) => x.id === tab);
  if (!p) { $("main").innerHTML = '<p class="empty">No prizes on this link.</p>'; return; }
  const b = ballots[p.id] || {};
  const list = p.entries.map(projectBy).filter(Boolean);
  const byRank = (r) => Object.entries(b).find(([, v]) => v.rank === r)?.[0];
  $("main").innerHTML = `<div class="head"><h1>${esc(p.id.startsWith("bounty:") ? p.name + " bounty" : "Track " + p.name)} · ${esc(p.amount)}</h1>
      <p class="how">${p.kind === "rank" ? "Tap 1st, 2nd, 3rd." : "Star the ones worth discussing. One line each."}</p>
      ${p.kind === "rank" ? `<div class="picks">${[1, 2, 3].map((r) => { const e = byRank(r); return `<div class="pick${e ? " set" : ""}"><b>${RK[r - 1]}</b>${e ? esc(projectBy(e)?.team) : "—"}</div>`; }).join("")}</div>` : ""}
    </div>` +
    (list.length ? list.map((x) => card(p, x, b[x.entry] || {})).join("") : '<p class="empty">No projects entered this prize.</p>');
  showJump();
}

function card(p, x, v) {
  const video = x.file ? `<button class="lk play" data-play="${esc(x.entry)}">▶ Demo</button>` : x.video ? `<a class="lk play" href="${esc(x.video)}" target="_blank" rel="noopener noreferrer">▶ Demo ↗</a>` : `<span class="lk none">no demo</span>`;
  const ctl = p.kind === "rank"
    ? `<div class="rank">${[1, 2, 3].map((r) => `<button class="rk${v.rank === r ? " on" : ""}" data-rank="${r}" data-e="${esc(x.entry)}" aria-pressed="${v.rank === r}">${RK[r - 1]}</button>`).join("")}</div>`
    : `<button class="star${v.star ? " on" : ""}" data-star="${esc(x.entry)}" aria-pressed="${!!v.star}">${v.star ? "★ Starred" : "☆ Star"}</button>`;
  return `<section class="card${x.entry === now ? " now" : ""}" id="c-${esc(x.entry)}">
    <div class="n"><span>#${String(x.n).padStart(2, "0")}</span>${x.entry === now ? '<span class="live">● on screen</span>' : ""}</div>
    <h2>${esc(x.team)}</h2><p class="pt">${esc(x.pitch)}</p>
    <div class="links">${video}${x.repo ? `<a class="lk" href="${esc(x.repo)}" target="_blank" rel="noopener noreferrer">Repo ↗</a>` : ""}</div>
    ${ctl}
    <input class="note" data-note="${esc(x.entry)}" maxlength="140" placeholder="One line (optional)" value="${esc(v.note || "")}" autocomplete="off">
  </section>`;
}

function change(entry, fn) {
  const b = (ballots[tab] ||= {});
  const v = { ...(b[entry] || {}) };
  fn(v, b);
  if (!v.rank) delete v.rank;
  if (!v.star) delete v.star;
  if (!v.note) delete v.note;
  if (Object.keys(v).length) b[entry] = v; else delete b[entry];
  dirty.add(tab);
  store.set(lsKey(tab), { ballot: b, dirty: true, at: Math.floor(Date.now() / 1000) });
  queueFlush();
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-tab],[data-rank],[data-star],[data-play]");
  if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; store.set(`localhost-judge-tab:${code}`, tab); render(); scrollTo({ top: 0 }); return; }
  if (t.dataset.play) { const x = projectBy(t.dataset.play); $("video").src = x.file; $("vid").hidden = false; $("video").play().catch(() => {}); return; }
  if (t.dataset.rank) {
    const r = +t.dataset.rank, entry = t.dataset.e;
    change(entry, (v, b) => {
      if (v.rank === r) { v.rank = 0; return; }
      for (const [k, o] of Object.entries(b)) if (k !== entry && o.rank === r) { delete o.rank; if (!Object.keys(o).length) delete b[k]; }
      v.rank = r;
    });
    render();
    return;
  }
  if (t.dataset.star) { change(t.dataset.star, (v) => (v.star = !v.star)); render(); }
});
document.addEventListener("input", (e) => { if (e.target.dataset.note !== undefined) change(e.target.dataset.note, (v) => (v.note = e.target.value.slice(0, 140))); });
$("vclose").onclick = () => { $("video").pause(); $("video").removeAttribute("src"); $("video").load(); $("vid").hidden = true; };

// Saving: debounced, one prize at a time, retried with backoff until it lands.
let timer = null, flushing = false, backoff = 1000;
function queueFlush() { sync("busy", "saving…"); clearTimeout(timer); timer = setTimeout(flush, 500); }
async function flush() {
  if (flushing) return;
  flushing = true;
  try {
    for (const prize of [...dirty]) {
      const sent = JSON.stringify(ballots[prize] || {});
      const j = await post("ballot", { prize, ballot: JSON.parse(sent) });
      if (JSON.stringify(ballots[prize] || {}) === sent) { dirty.delete(prize); store.set(lsKey(prize), { ballot: ballots[prize] || {}, dirty: false, at: j.at }); }
    }
    backoff = 1000;
    if (dirty.size) { flushing = false; return flush(); }
    sync("ok", "saved ✓");
  } catch (e) {
    if (e.status === 409) { sync("off", "closed"); dirty.clear(); }
    else if (e.status === 422 || e.status === 403) { sync("off", "not saved: " + e.message); }
    else { sync("off", "offline · retrying"); setTimeout(() => { flushing = false; flush(); }, backoff); backoff = Math.min(30000, backoff * 2); return; }
  }
  flushing = false;
}
window.addEventListener("online", () => dirty.size && flush());
window.addEventListener("beforeunload", (e) => { if (dirty.size) { e.preventDefault(); e.returnValue = ""; } });

// The team on the big screen: polled while this page is open.
function markNow() {
  for (const el of document.querySelectorAll(".card")) {
    const on = el.id === "c-" + now;
    el.classList.toggle("now", on);
    const n = el.querySelector(".n"), live = n.querySelector(".live");
    if (on && !live) n.insertAdjacentHTML("beforeend", '<span class="live">● on screen</span>');
    if (!on && live) live.remove();
  }
  showJump();
}
function showJump() {
  const j = $("jump"), el = now && document.getElementById("c-" + now), x = now && projectBy(now);
  if (!el || !x) { j.hidden = true; return; }
  const r = el.getBoundingClientRect();
  j.hidden = r.top < innerHeight && r.bottom > 130;
  j.textContent = "On screen: " + x.team + (r.top > 0 ? " ↓" : " ↑");
}
$("jump").onclick = () => document.getElementById("c-" + now)?.scrollIntoView({ behavior: "smooth", block: "start" });
addEventListener("scroll", showJump, { passive: true });
async function poll() {
  if (data && document.visibilityState === "visible") {
    try {
      const j = await post("now", {});
      if (j.now !== now) {
        now = j.now;
        markNow();
        // Follow the screen unless the judge is typing a note.
        const typing = document.activeElement?.dataset?.note !== undefined;
        if (!typing && now) document.getElementById("c-" + now)?.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    } catch {}
  }
  setTimeout(poll, 5000);
}
await load();
poll();
</script>
</body>
</html>
