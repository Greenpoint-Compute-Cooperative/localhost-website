<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSVP · LOCALHOST</title>
<meta name="robots" content="noindex">
<link rel="icon" href="https://localhostai.nyc/icon-192.png" sizes="192x192" type="image/png">
<link rel="icon" href="https://localhostai.nyc/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="https://localhostai.nyc/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="https://localhostai.nyc/site.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="https://localhostai.nyc/apple-touch-icon.png">
<meta name="theme-color" content="#0c0e11">
<link rel="stylesheet" href="shared/base.css">
<style>
  @font-face { font-family: "IBM Plex Mono"; src: url("fonts/IBMPlexMono-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "IBM Plex Mono"; src: url("fonts/IBMPlexMono-500.woff2") format("woff2"); font-weight: 500; font-display: swap; }
  @font-face { font-family: "IBM Plex Mono"; src: url("fonts/IBMPlexMono-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }
  /* same tokens as the home page's window (theme 9, ciphertext) */
  :root { --pg: #0c0e11; --fg: #e9ecef; --ln: #2a3038; --pri: #c8ff00; --prifg: #0b0b0c; --hi: #f2f4f6; --mid: #a7b0ba; --lo: #6b747e; --read: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
  html, body { height: auto; }
  body { min-height: 100svh; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; cursor: crosshair; }
  .corner { position: absolute; z-index: 5; padding: 18px 20px; line-height: 1.7; pointer-events: none; }
  .tl { top: 0; left: 0; } .tr { top: 0; right: 0; text-align: right; position: fixed; }
  .rec { color: #ff3b2f; }
  .win { position: relative; z-index: 10; margin: 64px 12px 0; width: min(560px, calc(100vw - 24px)); background: var(--pg); color: var(--fg); border: 1px solid var(--pri); box-shadow: 12px 12px 0 rgba(0,0,0,.6); cursor: default; }
  .ch { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #14181d; border-bottom: 1px solid var(--ln); font-size: 12px; }
  .ch .lk { flex: none; width: 10px; height: 8px; background: var(--pri); position: relative; margin-top: 5px; }
  .ch .lk::before { content: ""; position: absolute; left: 2px; top: -6px; width: 4px; height: 5px; border: 1px solid var(--pri); border-bottom: 0; }
  .ch .f { flex: 1; min-width: 0; padding: 5px 9px; border: 1px solid var(--ln); }
  .ch .k { color: #8b939c; font-size: 11px; white-space: nowrap; }
  .ch .x { color: #8b939c; text-decoration: none; padding: 0 2px; } .ch .x:hover { color: var(--pri); }
  .head { padding: 20px 20px 0; }
  .head h1 { font-weight: normal; font-size: 26px; letter-spacing: .02em; text-transform: uppercase; color: var(--hi); }
  .head .when { margin-top: 6px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--lo); }
  .apf { padding: 18px 20px 22px; }
  .apf .row2 .b { min-width: 140px; text-align: center; }
  .b { font: 13px var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 12px 18px; background: var(--pg); color: var(--hi); border: 1px solid #3a424c; text-decoration: none; cursor: pointer; }
  .b.pri { background: var(--pri); color: var(--prifg); border-color: var(--pri); }
  .b:hover { background: var(--pri); color: var(--prifg); }
  .b:disabled { opacity: .6; cursor: wait; }
  .foot { position: relative; z-index: 10; display: flex; gap: 22px; margin: 22px 0 28px; }
  .foot a { text-decoration: none; } .foot a:hover { color: var(--pri); }
  .foot { flex-wrap: wrap; justify-content: center; }
  .host { display: inline-flex; align-items: center; gap: 7px; } .host a { display: inline-flex; align-items: center; gap: 7px; } .host canvas { width: 18px; height: 18px; display: block; }

  .opts { padding: 20px 20px 8px; display: grid; gap: 10px; }
  .opt { font: 15px var(--read); font-weight: 600; text-align: left; padding: 16px 18px; background: var(--pg); color: var(--hi); border: 1px solid #3a424c; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .opt .t { font: 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--lo); }
  .opt.pri { background: var(--pri); color: var(--prifg); border-color: var(--pri); }
  .opt.pri .t { color: #2b3a00; }
  .opt.sel:not(.pri) { border-color: var(--hi); }
  .opt:hover:not(.pri) { border-color: var(--pri); color: var(--pri); }
  .opt:disabled { opacity: .6; cursor: wait; }
  .msg { min-height: 1.6em; padding: 4px 20px 18px; font: 12px var(--mono); letter-spacing: .06em; color: var(--mid); }
  .done { padding: 22px 20px 24px; }
  .done h2 { font: 600 26px/1.2 var(--read); color: var(--hi); }
  .done p { margin-top: 10px; font: 15px/1.6 var(--read); color: var(--mid); }
  .done .row { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; }
  .done .chg { margin-top: 18px; font: 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; }
  .done .chg a { color: var(--lo); } .done .chg a:hover { color: var(--pri); }
  .bad { padding: 22px 20px 26px; font: 15px/1.6 var(--read); color: var(--mid); }
  @media (max-width: 640px) {
    .corner.tr, .ch .k { display: none; }
    .win { margin-top: 58px; }
    .head { padding: 18px 16px 0; } .opts { padding: 18px 16px 6px; } .msg { padding: 4px 16px 16px; } .done, .bad { padding-left: 16px; padding-right: 16px; }
    .done .row .b { flex: 1 1 100%; text-align: center; }
  }
</style>
</head>
<body>
<canvas class="thermal" id="c"></canvas>
<div class="corner tl hud"><span class="rec">● REC</span> CAM 07 // NEW YORK</div>
<div class="corner tr hud" id="clock">—</div>
<main class="win" id="rsvp">
  <div class="ch"><span class="lk"></span><span class="f">localhost/rsvp</span><span class="k">key held on this machine</span><a class="x" href="/" aria-label="Back to localhost">×</a></div>
  <div id="ask">
    <div class="head"><h1>Are you coming?</h1><p class="when">Sat, Nov 7 · 9 AM–7 PM · The School, 29 Nassau Ave</p></div>
    <div class="opts">
      <button class="opt pri" data-a="coming">I'm coming <span class="t">lock it in</span></button>
      <button class="opt" data-a="maybe">Not sure yet</button>
      <button class="opt" data-a="cant">Can't make it</button>
    </div>
    <div class="cf-turnstile" data-action="localhost-rsvp" data-theme="dark" data-size="flexible" data-appearance="interaction-only" style="padding:0 20px"></div>
    <p class="msg" id="msg" role="status"></p>
  </div>
  <div class="done" id="done" hidden></div>
</main>
<nav class="foot hud"><a href="/">← localhost</a><span class="host">Hosted by <a href="https://x.com/DistributedMarz" target="_blank" rel="noopener"><canvas id="mark" aria-hidden="true"></canvas>dmarz</a></span></nav>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<script type="module">
import { thermal } from "./shared/thermal.js";
import { cube } from "./shared/cube.js";
import { FORMS_API } from "./shared/forms.js";
cube(document.getElementById("mark"));
thermal(document.getElementById("c"), { block: 5 });
const clock = document.getElementById("clock");
setInterval(() => { clock.innerHTML = new Date().toISOString().replace("T", " ").slice(0, 19) + "Z<br>FRAME " + Math.floor(performance.now() / 41.7); }, 250);

// ?c=<per-person code from the confirmation email>&a=<coming|maybe|cant>. Nothing is recorded until a
// tap: mail scanners open every link in an email, a tap they don't make.
const q = new URLSearchParams(location.search);
const code = (q.get("c") || "").trim().toLowerCase();
const pre = q.get("a");
const GCAL = "https://calendar.google.com/calendar/render?action=TEMPLATE&text=LOCALHOST+AI+hackathon&dates=20261107T090000%2F20261107T190000&ctz=America%2FNew_York&location=The+School%2C+29+Nassau+Ave%2C+Brooklyn%2C+NY+11222&details=https%3A%2F%2Flocalhostai.nyc";
const MAP = "https://share.google/VOJvRZbIfVAbeHXdO";
const DONE = {
  coming: `<h2>Locked in 🗽</h2><p>See you Saturday. Doors open at 9 AM at The School, 29 Nassau Ave. Bring a laptop and charger.</p>
    <div class="row"><a class="b pri" href="${GCAL}" target="_blank" rel="noopener">+ Add to calendar</a><a class="b" href="${MAP}" target="_blank" rel="noopener">Directions →</a></div>`,
  maybe: `<h2>Got it.</h2><p>We'll check in on Friday. If you know before then, come back to this link and tap again.</p>`,
  cant: `<h2>Thanks for telling us.</h2><p>Your seat goes to someone else. Hope to see you at the next one.</p>`,
};
const ask = document.getElementById("ask"), done = document.getElementById("done"), msg = document.getElementById("msg");
const buttons = [...document.querySelectorAll(".opt")];

if (!/^[a-z0-9]{6,16}$/.test(code)) {
  ask.innerHTML = `<div class="head"><h1>Are you coming?</h1></div><p class="bad">This link is missing your code. Open the button in your confirmation email, or reply to that email.</p>`;
} else {
  if (pre === "cant" || pre === "maybe") buttons.forEach((b) => b.classList.toggle("sel", b.dataset.a === pre));
  let last = null;
  try { last = localStorage.getItem("localhost-rsvp:" + code); } catch {}
  if (last && DONE[last]) show(last);

  const ts = document.querySelector(".cf-turnstile");
  let widget = null;
  const render = () => {
    if (widget !== null || !window.turnstile) return;
    widget = window.turnstile.render(ts, { sitekey: /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? "1x00000000000000000000AA" : "0x4AAAAAAFLsrU-_juvQUw02", action: "localhost-rsvp", theme: "dark", size: "flexible", appearance: "interaction-only" });
  };
  const t = setInterval(() => { render(); if (widget !== null) clearInterval(t); }, 100);
  setTimeout(() => clearInterval(t), 30000);
  const token = () => document.querySelector('[name="cf-turnstile-response"]')?.value || "";

  buttons.forEach((b) => b.addEventListener("click", async () => {
    const answer = b.dataset.a;
    buttons.forEach((x) => (x.disabled = true));
    if (!token()) {
      msg.textContent = "checking you're human…";
      for (const t0 = Date.now(); !token() && Date.now() - t0 < 20000; ) await new Promise((r) => setTimeout(r, 250));
      if (!token()) { msg.textContent = "Tick the Cloudflare box above, then tap again."; buttons.forEach((x) => (x.disabled = false)); return; }
    }
    msg.textContent = "sending…";
    try {
      const res = await fetch(FORMS_API + "/api/f/localhost-rsvp", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code, answer, "cf-turnstile-response": token() }) });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "HTTP " + res.status);
      try { localStorage.setItem("localhost-rsvp:" + code, answer); } catch {}
      show(answer);
    } catch (err) {
      msg.textContent = (err.message || "Something broke.") + " Try again, or just reply to the email.";
      if (widget !== null) window.turnstile?.reset(widget);
      buttons.forEach((x) => (x.disabled = false));
    }
  }));
}

function show(answer) {
  ask.hidden = true;
  done.hidden = false;
  done.innerHTML = DONE[answer] + `<p class="chg"><a href="#" id="chg">change my answer</a></p>`;
  document.getElementById("chg").addEventListener("click", (e) => { e.preventDefault(); done.hidden = true; ask.hidden = false; msg.textContent = ""; });
}
</script>
</body>
</html>
